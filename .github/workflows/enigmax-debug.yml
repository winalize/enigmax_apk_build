name: EnigMax 1.5.6 API36 - Debug APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake gettext
      - uses: android-actions/setup-android@v3
      - name: Android API 36 and NDK r28c
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "build-tools;37.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          sudo mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          sudo ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          sudo ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/avdmanager" "$ANDROID_SDK_ROOT/tools/bin/avdmanager"

      - name: Adapt server paths for GitHub
        run: |
          sed -i "s|^android.sdk_path *=.*|android.sdk_path = $ANDROID_SDK_ROOT|" buildozer.spec
          sed -i "s|^android.ndk_path *=.*|android.ndk_path = $ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}|" buildozer.spec
          sed -i "s|^build_dir *=.*|build_dir = $GITHUB_WORKSPACE/.buildozer|" buildozer.spec
          sed -i "s|^bin_dir *=.*|bin_dir = $GITHUB_WORKSPACE/bin|" buildozer.spec
          if grep -qE '^\s*p4a\.branch\s*=' buildozer.spec; then
            sed -i 's|^\s*p4a\.branch\s*=.*|p4a.branch = v2024.01.21|' buildozer.spec
          else
            printf '\np4a.branch = v2024.01.21\n' >> buildozer.spec
          fi

      - name: Buildozer toolchain
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.33 "sh<2"
      - name: EnigMax static gate
        run: python scripts/enigmax_ci_gate.py
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: enigmax-156-api36-r28c-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
      - name: Build debug APK
        id: build_debug
        continue-on-error: true
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-debug.log

      - name: Deep Gradle diagnostics on failure
        if: steps.build_debug.outcome == 'failure'
        run: |
          set +e
          DIST_DIR="$(find "$GITHUB_WORKSPACE/.buildozer/android/platform" -type f -name gradlew -path "*/dists/enigmax/*" -printf '%h\n' | head -n1)"
          echo "DIST_DIR=$DIST_DIR" | tee gradle-diagnostic.log
          if [ -n "$DIST_DIR" ]; then
            cd "$DIST_DIR"
            ./gradlew assembleDebug --stacktrace --info 2>&1 | tee -a "$GITHUB_WORKSPACE/gradle-diagnostic.log"
            find build/reports -type f -maxdepth 5 -print 2>/dev/null | tee -a "$GITHUB_WORKSPACE/gradle-diagnostic.log"
          else
            echo "Gradle dist directory not found." | tee -a "$GITHUB_WORKSPACE/gradle-diagnostic.log"
          fi

      - name: Fail job if APK build failed
        if: steps.build_debug.outcome == 'failure'
        run: exit 1
      - name: Collect
        if: always()
        run: |
          mkdir -p ci-artifacts
          find bin -maxdepth 1 -type f -name "*.apk" -exec cp -v {} ci-artifacts/ \; 2>/dev/null || true
          cp build-debug.log ci-artifacts/ 2>/dev/null || true
          cp gradle-diagnostic.log ci-artifacts/ 2>/dev/null || true
          find "$GITHUB_WORKSPACE/.buildozer/android/platform" -path "*/build/reports/problems/problems-report.html" -exec cp -v {} ci-artifacts/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENIGMAX-1.5.6-API36-DEBUG
          path: ci-artifacts/
          if-no-files-found: warn
